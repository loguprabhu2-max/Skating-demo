<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Skate Academy — Training Videos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>
  
  <nav class="navbar navbar-expand-lg navbar-dark bg-darkblue py-3">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <div class="logo-mark">🛼</div>
          <div class="ms-2 text-yellow fw-bold">The Skate Academy</div>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="videos.html">Training Videos</a></li>
            <li class="nav-item"><a class="nav-link" href="diet.html">Diet Plans</a></li>
            <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
            <li class="nav-item"><a class="nav-link" href="classes.html">Classes</a></li>
            <li class="nav-item"><a class="nav-link" href="admin.html">Admin</a></li>
            <li class="nav-item ms-3"><a class="btn btn-yellow btn-sm" href="#">Sign Up</a></li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="py-5">
      <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3>Training Videos</h3>
          <div>
            <button class="btn btn-outline-light me-2" id="freeTab">Free</button>
            <button class="btn btn-yellow" id="paidTab">Paid</button>
          </div>
        </div>
        <div class="mb-3">
          <select id="categoryFilter" class="form-select w-auto">
            <option value="all">All Categories</option>
            <option>Basics</option>
            <option>Speed</option>
            <option>Endurance</option>
            <option>Advanced</option>
          </select>
        </div>
        <div class="row g-3" id="videoList"></div>
      </div>
    </main>

    <!-- Video Modal -->
    <div class="modal fade" id="videoModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="videoTitle">Video</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body text-center">
            <div id="videoPlayer" class="ratio ratio-16x9 bg-black text-white d-flex align-items-center justify-content-center">Video Player</div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
