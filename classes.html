<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Skate Academy — Classes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-darkblue py-3">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <div class="logo-mark">🛼</div>
          <div class="ms-2 text-yellow fw-bold">The Skate Academy</div>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="videos.html">Training Videos</a></li>
            <li class="nav-item"><a class="nav-link" href="diet.html">Diet Plans</a></li>
            <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
            <li class="nav-item"><a class="nav-link" href="classes.html">Classes</a></li>
            <li class="nav-item"><a class="nav-link" href="admin.html">Admin</a></li>
            <li class="nav-item ms-3"><a class="btn btn-yellow btn-sm" href="#">Sign Up</a></li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="py-5">
      <div class="container">
        <h3>Register for a Class</h3>
        <form id="classForm" class="row g-3 mt-3">
          <div class="col-md-6">
            <input class="form-control" placeholder="Full Name" required>
          </div>
          <div class="col-md-6">
            <input class="form-control" placeholder="Email" required>
          </div>
          <div class="col-md-4">
            <select class="form-select" required>
              <option selected>Choose Program</option>
              <option>Beginner</option>
              <option>Intermediate</option>
              <option>Advanced</option>
            </select>
          </div>
          <div class="col-md-4">
            <input class="form-control" placeholder="Preferred Location">
          </div>
          <div class="col-md-4">
            <input class="form-control" type="date">
          </div>
          <div class="col-12">
            <button class="btn btn-yellow" type="submit">Register</button>
          </div>
        </form>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
